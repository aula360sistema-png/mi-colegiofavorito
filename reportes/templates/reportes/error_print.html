<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte — {{ centro.nombre }}</title>
    <style>
        body { font-family: Georgia, 'Times New Roman', serif; color: #111; padding: 40px; max-width: 900px; margin: 0 auto; }
        .encabezado { text-align: center; border-bottom: 3px double #111; padding-bottom: 12px; margin-bottom: 30px; }
        .encabezado h1 { font-size: 18px; text-transform: uppercase; }
        .encabezado p { font-size: 12px; color: #444; margin-top: 4px; }
        p.aviso { text-align: center; color: #666; font-size: 13px; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="encabezado">
        <h1>República Dominicana</h1>
        <p>Código: {{ centro.codigo_minerd }} · {{ centro.nombre }}</p>
    </div>
    <p class="aviso">{{ error }}</p>
</body>
</html>
