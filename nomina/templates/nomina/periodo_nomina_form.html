

# periodo_nomina_form.html


{% extends 'home.html' %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h1>{{ accion }} Periodo</h1>
    </div>

    <form method="post" class="custom-form">

        {% csrf_token %}

        <div class="form-grid">

            {% for field in form %}

            <div class="form-group">

                <label>
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p class="error-text">{{ error }}</p>
                {% endfor %}

            </div>

            {% endfor %}

        </div>

        <div class="form-actions">

            <button type="submit" class="btn-primary">
                Guardar
            </button>

            <a href="{% url 'nomina:periodo_nomina_list' %}" class="btn-secondary">
                Volver
            </a>

        </div>

    </form>

</div>

{% endblock %}
