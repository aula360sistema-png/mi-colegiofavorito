{% extends 'home.html' %}

{% block title %}
  Mi Colegio - Inicio Estudiante
{% endblock %}

{% block content %}
<div class="p-6">
  <div class="bg-white rounded-2xl shadow p-8">
    <div class="flex items-center gap-4 mb-4">
      <div class="w-14 h-14 rounded-full bg-indigo-100 flex items-center justify-center">
        <i class="fas fa-user-graduate text-indigo-600 text-2xl"></i>
      </div>

      <div>
        <h1 class="text-2xl font-bold text-slate-800">
          Hola, {{ estudiante.nombre_completo }}
        </h1>

        <p class="text-slate-500">
          Matrícula {{ estudiante.matricula }}
        </p>
      </div>
    </div>

    <p class="text-slate-600">
      Bienvenido a tu portal. Aquí podrás consultar tus calificaciones,
      asistencia y boletines.
    </p>
  </div>
</div>
{% endblock %}
