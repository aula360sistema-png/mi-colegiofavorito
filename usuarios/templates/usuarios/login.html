{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Mi Colegio Favorito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
    <div class="auth-bg-pattern"></div>

    <div class="auth-box auth-fade-in">
        <div class="auth-logo">
            <img src="{% static 'img/logo-login.svg' %}" alt="Mi Colegio Favorito" class="auth-logo-img">
        </div>

        <h2>Iniciar Sesión</h2>
        <p class="auth-subtitle">Sistema de Gestión Académica</p>

        {% if error %}
            <div class="auth-error">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                {{ error }}
            </div>
        {% endif %}

        <form method="post" id="loginForm">
            {% csrf_token %}

            <div class="honeypot" aria-hidden="true">
                <label for="website">No completar este campo</label>
                <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="auth-field">
                <label for="username">Usuario</label>
                <div class="auth-input-wrapper">
                    <svg class="auth-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" name="username" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
            </div>

            <div class="auth-field">
                <label for="password">Contraseña</label>
                <div class="auth-input-wrapper">
                    <svg class="auth-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    <button type="button" class="auth-toggle-pass" id="togglePassword" aria-label="Mostrar contraseña" tabindex="-1">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="auth-checkbox">
                    <input type="checkbox" name="remember" id="remember">
                    <span class="auth-checkmark"></span>
                    Recordarme
                </label>
            </div>

            <button type="submit" class="auth-btn">
                <span>Iniciar Sesión</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>

        <div class="auth-footer">
            &copy; 2026 Mi Colegio Favorito
        </div>
    </div>

    <script>
    (function() {
        var toggle = document.getElementById('togglePassword');
        var pass = document.getElementById('password');
        if (toggle && pass) {
            toggle.addEventListener('click', function() {
                var isPass = pass.type === 'password';
                pass.type = isPass ? 'text' : 'password';
                toggle.classList.toggle('showing', isPass);
                toggle.setAttribute('aria-label', isPass ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        }
    })();
    </script>
</body>
</html>
