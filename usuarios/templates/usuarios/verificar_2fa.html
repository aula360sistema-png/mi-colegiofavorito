{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h2>Verificación</h2>
        <p class="sub">Ingresa el código de 6 dígitos de tu aplicación autenticadora para <strong>{{ usuario.username }}</strong>.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="codigo">Código</label>
            <input type="text" name="codigo" id="codigo" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" required>
            <button type="submit">Verificar</button>
        </form>

        <a class="back" href="{% url 'usuarios:login' %}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
