<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(to right, #4b6cb7, #182848); }
        .login-container { background: #fff; padding: 40px 50px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-container h2 { margin-bottom: 10px; color: #333; font-size: 26px; font-weight: 600; }
        .login-container p.sub { color: #666; margin-bottom: 25px; font-size: 14px; }
        .login-container p.error { color: #e74c3c; margin-bottom: 20px; font-weight: 500; }
        .login-container label { display: block; text-align: left; margin-bottom: 5px; font-weight: 500; color: #555; }
        .login-container input { width: 100%; padding: 12px 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 18px; letter-spacing: 4px; text-align: center; transition: all 0.3s ease; }
        .login-container input:focus { border-color: #4b6cb7; box-shadow: 0 0 5px rgba(75,108,183,0.5); outline: none; }
        .login-container button { width: 100%; padding: 12px; background: #4b6cb7; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .login-container button:hover { background: #3a54a0; }
        .login-container a.back { display: inline-block; margin-top: 15px; color: #888; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Verificación</h2>
        <p class="sub">Ingresa el código de 6 dígitos de tu aplicación autenticadora para <strong>{{ usuario.username }}</strong>.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="codigo">Código</label>
            <input type="text" name="codigo" id="codigo" inputmode="numeric" maxlength="6" placeholder="000000" required>
            <button type="submit">Verificar</button>
        </form>

        <a class="back" href="{% url 'usuarios:login' %}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
