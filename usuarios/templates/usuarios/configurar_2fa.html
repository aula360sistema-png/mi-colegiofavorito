{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar 2FA</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <script src="{% static 'vendor/qrcodejs/qrcode.min.js' %}"></script>
</head>
<body class="auth-page">
    <div class="auth-box">
        <h2>Configura tu 2FA</h2>
        <p class="sub">Escanea el código QR con Google Authenticator, Authy o similar, o ingresa la clave manualmente.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div id="qrcode" data-uri="{{ uri }}"></div>

        <div class="auth-secret">{{ secret }}</div>

        <form method="post">
            {% csrf_token %}
            <label for="codigo">Código de 6 dígitos</label>
            <input type="text" name="codigo" id="codigo" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" required>
            <button type="submit">Activar y continuar</button>
        </form>

        <a class="back" href="{% url 'usuarios:login' %}">Volver al inicio de sesión</a>
    </div>

    <script src="{% static 'js/qr-render.js' %}"></script>
</body>
</html>
