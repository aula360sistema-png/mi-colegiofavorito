{% extends "home.html" %}
{% load formatos %}

{% block title %}Crear factura — Mi Colegio{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
  <div class="mb-6">
    <a href="{% url 'facturacion:lista_facturas' %}" class="text-indigo-600 hover:text-indigo-800 text-sm">
      <i class="fas fa-arrow-left"></i> Volver a facturas
    </a>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h1 class="text-xl font-bold text-gray-800 mb-6">
      <i class="fas fa-file-invoice text-indigo-600"></i> Crear factura manual
    </h1>

    <form method="post">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <!-- Estudiante -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estudiante *</label>
          <select name="estudiante" required
                  class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-800 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
            <option value="">Seleccionar estudiante...</option>
            {% for est in estudiantes %}
            <option value="{{ est.pk }}">{{ est.nombre_completo }} ({{ est.matricula }})</option>
            {% endfor %}
          </select>
        </div>

        <!-- Tipo de comprobante -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de comprobante (NCF) *</label>
          <select name="tipo" required
                  class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-800 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
            {% for tipo in tipos %}
            <option value="{{ tipo.pk }}">{{ tipo.codigo }} · {{ tipo.nombre }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Descripción -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción del servicio</label>
        <input type="text" name="descripcion" placeholder="Ej: Matrícula, mensualidad, uniforme..."
               class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-800 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <!-- Cantidad -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad *</label>
          <input type="number" name="cantidad" value="1" min="1" required
                 class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-800 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
        </div>

        <!-- Precio -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio unitario (RD$) *</label>
          <input type="number" name="precio" step="0.01" min="0" required placeholder="0.00"
                 class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-800 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
        </div>

        <!-- ITBIS -->
        <div class="flex items-end pb-1">
          <label class="flex items-center gap-2">
            <input type="checkbox" name="aplica_itbis" class="h-4 w-4 rounded border-gray-300 accent-indigo-600">
            <span class="text-sm text-gray-700">Aplicar ITBIS (18%)</span>
          </label>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">
          <i class="fas fa-file-invoice"></i> Crear factura
        </button>
        <a href="{% url 'facturacion:lista_facturas' %}" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-200 transition">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
