{% extends "home.html" %}

{% block content %}
<div class="max-w-xl mx-auto">

    <div class="mb-6">
        <h2 class="text-2xl font-semibold">
            {{ accion }} Grado
        </h2>
        <p class="text-gray-500 text-sm">
            Completa la información del grado académico
        </p>
    </div>

    <div class="bg-white shadow rounded p-6">
        <form method="post">
            {% csrf_token %}

            <!-- NIVEL -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Nivel
                </label>
                {{ form.nivel }}
            </div>

            <!-- NOMBRE -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Nombre del grado
                </label>
                {{ form.nombre }}
            </div>

            <!-- BOTONES -->
            <div class="flex justify-end gap-3">
                <a href="{% url 'grado_list' %}"
                   class="px-4 py-2 rounded bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm">
                    Cancelar
                </a>

                <button type="submit"
                        class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700 text-sm">
                    Guardar
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
