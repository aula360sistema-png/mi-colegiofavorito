
<h2>Eliminar Area</h2>

<p>
    ¿Seguro que deseas eliminar la sección
    <strong>{{ area.nombre }}</strong>

</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        Sí, eliminar
    </button>
    <a href="{% url 'area_list' %}" class="btn btn-secondary">
        Cancelar
    </a>
</form>
