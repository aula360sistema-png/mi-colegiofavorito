
<h2>Eliminar Grado</h2>

<p>
    ¿Seguro que deseas eliminar el grado
    <strong>{{ grado.nombre }}</strong>
    del nivel <strong>{{ grado.nivel.nombre }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        Sí, eliminar
    </button>
    <a href="{% url 'grado_list' %}" class="btn btn-secondary">
        Cancelar
    </a>
</form>
