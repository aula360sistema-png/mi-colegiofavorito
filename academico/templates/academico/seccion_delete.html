
<h2>Eliminar Sección</h2>

<p>
    ¿Seguro que deseas eliminar la sección
    <strong>{{ seccion.nombre }}</strong>
    del grado <strong>{{ seccion.grado.nombre }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        Sí, eliminar
    </button>
    <a href="{% url 'seccion_list' %}" class="btn btn-secondary">
        Cancelar
    </a>
</form>
