{% extends "home.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-semibold">
                Áreas Curriculares
            </h2>
            <p class="text-sm text-gray-500">
                Gestión de áreas académicas del centro
            </p>
        </div>

        <a href="{% url 'area_create' %}"
           class="px-4 py-2 rounded bg-blue-600 text-white text-sm hover:bg-blue-700">
            + Nueva Área
        </a>
    </div>

    <!-- Table -->
    <div class="bg-white shadow rounded overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-left">
                <tr>
                    <th class="px-4 py-3">Nombre</th>
                    <th class="px-4 py-3 w-40 text-right">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for area in areas %}
                <tr class="border-t hover:bg-gray-50">
                    <td class="px-4 py-2">
                        {{ area.nombre }}
                    </td>
                    <td class="px-4 py-2 text-right space-x-2">
                        <a href="{% url 'area_update' area.id %}"
                           class="px-3 py-1 rounded bg-yellow-100 text-yellow-700 text-xs hover:bg-yellow-200">
                            Editar
                        </a>
                       <button
    onclick="confirmarEliminacion('{{ area.id }}', '{{ area.nombre }}')"
    class="px-3 py-1 rounded bg-red-100 text-red-700 text-xs hover:bg-red-200">
    Eliminar
</button>

                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="px-4 py-6 text-center text-gray-500">
                        No hay áreas registradas
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmarEliminacion(id, nombre) {
    Swal.fire({
        title: '¿Eliminar área?',
        text: `Se eliminará el área "${nombre}"`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc2626',
        cancelButtonColor: '#6b7280',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = `/areas/${id}/eliminar/`;

            const csrf = document.createElement('input');
            csrf.type = 'hidden';
            csrf.name = 'csrfmiddlewaretoken';
            csrf.value = '{{ csrf_token }}';

            form.appendChild(csrf);
            document.body.appendChild(form);
            form.submit();
        }
    });
}
</script>

{% endblock %}
