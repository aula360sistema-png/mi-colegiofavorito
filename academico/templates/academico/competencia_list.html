{% extends "home.html" %}

{% block title %}Competencias{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-semibold">📌 Competencias</h1>

        <a href="{% url 'competencia_create' %}"
           class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            + Nueva Competencia
        </a>
    </div>

    <div class="bg-white shadow rounded-lg">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-left">
                <tr>
                    <th class="px-4 py-2">Nombre</th>
                    <th class="px-4 py-2 w-48">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for c in competencias %}
                <tr class="border-t">
                    <td class="px-4 py-2">
                        {{ c.nombre }}
                    </td>
                    <td class="px-4 py-2 flex gap-2">
                        <a href="{% url 'competencia_update' c.id %}"
                           class="text-yellow-600 hover:underline">
                            Editar
                        </a>

                        <button
                            onclick="confirmarEliminacion('{{ c.id }}', '{{ c.nombre }}')"
                            class="text-red-600 hover:underline">
                            Eliminar
                        </button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2"
                        class="px-4 py-6 text-center text-gray-500">
                        No hay competencias registradas
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmarEliminacion(id, nombre) {
    Swal.fire({
        title: '¿Eliminar competencia?',
        text: `Se eliminará la competencia "${nombre}"`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = `/competencias/${id}/eliminar/`;
        }
    })
}
</script>

{% endblock %}
