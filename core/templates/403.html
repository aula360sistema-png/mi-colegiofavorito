{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso denegado</title>
    <script src="{% static 'vendor/tailwind/tailwind.js' %}"></script>
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}" />
  </head>

  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-10 text-center">
      <div class="w-20 h-20 mx-auto rounded-full bg-red-100 flex items-center justify-center mb-6">
        <i class="fas fa-ban text-red-600 text-3xl"></i>
      </div>

      <h1 class="text-5xl font-bold text-slate-800 mb-2">403</h1>

      <h2 class="text-xl font-semibold text-slate-700 mb-3">Acceso denegado</h2>

      <p class="text-slate-500 mb-8">
        No tienes permisos para acceder a esta sección.
        Si crees que esto es un error, contacta al administrador del sistema.
      </p>

      <div class="flex flex-col gap-3">
        <a href="{% url 'core:home' %}"
           class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition">
          <i class="fas fa-home"></i>
          Volver al inicio
        </a>

        <a href="{% url 'usuarios:logout' %}"
           class="inline-flex items-center justify-center gap-2 text-slate-600 hover:text-slate-800 font-medium py-2 px-4 rounded-lg transition">
          <i class="fas fa-sign-out-alt"></i>
          Cerrar sesión
        </a>
      </div>
    </div>
  </body>
</html>
